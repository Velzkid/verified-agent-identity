name: Verify Human Identity
on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: Agent name
        required: true
        default: Velzkid

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      
      - name: Install ClawHub skill
        run: npx clawhub@latest install verified-agent-identity
      
      - name: Install script dependencies
        run: cd scripts && npm install
      
      - name: Link Agent to Existing DID
        run: node scripts/manualLinkHumanToAgent.js --agentDid "did:iden3:billions:main:2VmAkXrihYaL41fDjxST62kncGXFcjC63PTdn1tLUh" --challenge "{\"name\": \"${{ inputs.agent_name }}\"}"
